[project]
name = "quantcore"
version = "0.1.0"
description = "AI-Powered US Equity Research Platform"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Yathish Ragav", email = "yathishragav@gmail.com" }
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.14.2",
    "yfinance>=0.2.65",
    "pandas>=2.3.2",
    "requests>=2.32.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.1",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
]
