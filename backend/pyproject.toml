[project]
name = "quantcore"
version = "0.1.0"
description = "Point-in-time, reproducible quantitative equity research platform for US markets"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Yathish Ragav", email = "yathishragav@gmail.com" }
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.14.2",
    "yfinance>=0.2.65",
    "pandas>=2.3.2",
    "requests>=2.32.0",
    "PyJWT[crypto]>=2.13.0",
]

[project.scripts]
quantcore-ingestion-worker = "quantcore.services.ingestion_worker:main"
quantcore-ingestion-scheduler = "quantcore.services.ingestion_scheduler:main"
quantcore-ingestion-bootstrap = "quantcore.services.ingestion_bootstrap:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.1",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
]


[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "DTZ",
    "RUF",
    "SIM",
    "PIE",
    "FURB",
    "PLW",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations intentionally call Depends/parameter helpers
# in function signatures. Treat these framework factories as immutable-call
# defaults so B008 does not flag valid dependency-injection patterns.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]
